name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHPUnit Tests (Kirby ${{ matrix.kirby }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kirby: ['^4.0', '^5.0']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Require Kirby ${{ matrix.kirby }}
        run: composer require --no-update --dev "getkirby/cms:${{ matrix.kirby }}"

      - name: Install dependencies
        run: composer install --prefer-dist --no-security-blocking

      - name: Run tests
        run: ./vendor/bin/phpunit

  release:
    name: Build & Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Install PHP production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Create release archive
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          zip -r "we-are-open-${VERSION}.zip" \
            index.php \
            index.js \
            index.css \
            lib/ \
            snippets/ \
            vendor/ \
            --exclude "vendor/bin/*"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: we-are-open-v*.zip
          generate_release_notes: true
